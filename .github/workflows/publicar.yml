# Recalcula el acumulado con todos los Excel de excels/ y publica el panel en GitHub Pages.
name: Publicar dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar data.json desde excels/
        run: |
          cd scripts
          npm install --no-audit --no-fund
          node --max-old-space-size=6144 build_data.js ../excels ../data.json

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html data.json .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
